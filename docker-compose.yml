# Services d'infrastructure pour le développement local.
# PostgreSQL est exposé sur le port 5433 (le 5432 est souvent pris par une installation locale).
name: gestion-traiteurs

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traiteur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traiteur}
      POSTGRES_DB: ${POSTGRES_DB:-gestion_traiteurs}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-traiteur} -d ${POSTGRES_DB:-gestion_traiteurs}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
