# Services d'infrastructure pour le développement local.
# PostgreSQL est exposé sur le port 5433 (le 5432 est souvent pris par une installation locale).
name: gestion-traiteurs

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traiteur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traiteur}
      POSTGRES_DB: ${POSTGRES_DB:-gestion_traiteurs}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-traiteur} -d ${POSTGRES_DB:-gestion_traiteurs}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Stockage S3 des photos : RustFS (compatible S3 et MinIO) ; Cloudflare R2 en production.
  # MinIO ne publie plus d'images Docker pour son édition communautaire.
  # Le bucket, sa lecture publique et son CORS sont configurés par l'API au démarrage.
  storage:
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-traiteur}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-traiteur-secret}
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '${S3_PORT:-9000}:9000'
      - '${S3_CONSOLE_PORT:-9001}:9001'
    volumes:
      - storage-data:/data

volumes:
  postgres-data:
  redis-data:
  storage-data:
