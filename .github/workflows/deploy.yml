name: Déploiement

# Staging : automatiquement, après une CI réussie sur main (images construites, puis déployées).
# Production : uniquement par une étiquette de version (git tag v1.2.3 && git push --tags),
#   avec approbation manuelle (environnement GitHub « production »). L'image n'est PAS
#   reconstruite : c'est exactement celle testée en staging (sha du commit), ré-étiquetée.
# Retour en arrière : « Run workflow » (manuel), environnement + version précédente.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement
        type: choice
        options: [staging, production]
        required: true
      version:
        description: Version à (re)déployer (sha-1a2b3c4 ou v1.2.3)
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ─────────────── Images (après une CI réussie sur main) ───────────────
  build:
    name: Images Docker
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - id: meta
        name: Étiquette (sha-<commit>) et registre
        run: |
          echo "tag=sha-${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=$REGISTRY/${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          OWNER: ${{ github.repository_owner }}
        shell: bash

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image API (API, worker, migrations)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          build-args: RELEASE=${{ steps.meta.outputs.tag }}
          tags: ${{ steps.meta.outputs.image }}/traiteur-api:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Image web (back-office)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          build-args: RELEASE=${{ steps.meta.outputs.tag }}
          tags: ${{ steps.meta.outputs.image }}/traiteur-web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Démarrage réel des images, dans une base vide, avant tout déploiement
      - name: Vérification des images
        env:
          API: ${{ steps.meta.outputs.image }}/traiteur-api:${{ steps.meta.outputs.tag }}
          WEB: ${{ steps.meta.outputs.image }}/traiteur-web:${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          docker network create smoke
          docker run -d --name pg --network smoke -e POSTGRES_USER=traiteur \
            -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=traiteur postgres:17-alpine
          docker run -d --name redis --network smoke redis:7-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U traiteur -d traiteur && break; sleep 2; done
          cat > smoke.env <<'ENV'
          NODE_ENV=production
          DATABASE_URL=postgresql://traiteur:smoke@pg:5432/traiteur
          REDIS_URL=redis://redis:6379
          JWT_ACCESS_SECRET=verification-des-images-secret-jwt-0000000000
          OTP_SECRET=verification-des-images-secret-otp-0000000000
          PUBLIC_WEB_URL=https://app.exemple.ma
          CORS_ORIGINS=https://app.exemple.ma
          TRUST_PROXY=172.16.0.0/12
          S3_ENDPOINT=http://stockage-absent:9000
          S3_BUCKET=media
          S3_DOCUMENTS_BUCKET=documents
          S3_ACCESS_KEY_ID=verification
          S3_SECRET_ACCESS_KEY=verification
          S3_PUBLIC_URL=https://media.exemple.ma
          SMS_PROVIDER=twilio
          TWILIO_ACCOUNT_SID=AC00000000000000000000000000000000
          TWILIO_AUTH_TOKEN=verification-twilio-0000
          TWILIO_FROM=Traiteur
          ENV
          sed -i 's/^ *//' smoke.env
          run() { docker run --rm --network smoke --env-file smoke.env "$@"; }

          echo "▶ Utilisateur non-root"
          [ "$(docker run --rm "$API" id -u)" != 0 ] && [ "$(docker run --rm "$WEB" id -u)" != 0 ]
          echo "▶ Migrations et permissions"
          run "$API" sh -c 'node node_modules/prisma/build/index.js migrate deploy && node dist/cli/sync-permissions.js'
          echo "▶ Seed de démonstration refusé en production"
          if run "$API" node dist-seed/prisma/seed.js; then echo "Seed accepté en production"; exit 1; fi
          echo "▶ Création d'un traiteur"
          run "$API" node dist/cli/create-traiteur.js --slug verification --name "Traiteur Vérif" \
            --email contact@exemple.ma --phone 0522000000 --city Casablanca \
            --admin-phone 0612345678 --admin-first-name Admin --admin-last-name Test | grep -q '/invitation/'
          echo "▶ Démarrage de l'API, du worker et du back-office"
          docker run -d --name api --network smoke --env-file smoke.env "$API"
          docker run -d --name worker --network smoke --env-file smoke.env "$API" node dist/worker.js
          docker run -d --name web --network smoke -e API_INTERNAL_URL=http://api:3000/api/v1 \
            -e PUBLIC_API_URL=https://app.exemple.ma/api/v1 -e PUBLIC_MEDIA_URL=https://media.exemple.ma \
            -e TRAITEUR_SLUG=verification -e WEB_TRUSTED_PROXY_HOPS=1 "$WEB"
          for service in api web; do
            for i in $(seq 1 40); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' "$service")" = healthy ] && break
              sleep 3
            done
            docker inspect -f "$service : {{.State.Health.Status}}" "$service"
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$service")" = healthy ] || { docker logs "$service"; exit 1; }
          done
          [ "$(docker inspect -f '{{.State.Running}}' worker)" = true ] || { docker logs worker; exit 1; }
          echo "▶ Adresses publiques lues au démarrage (même image pour staging et production)"
          docker exec web node -e "fetch('http://127.0.0.1:3001/admin/login').then((r)=>r.text()).then((h)=>process.exit(h.includes('https://app.exemple.ma/api/v1')?0:1))"
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep traiteur-

  staging:
    name: Staging
    needs: build
    # Activé quand le serveur de staging est prêt (Settings › Variables : DEPLOY_STAGING=true)
    if: vars.DEPLOY_STAGING == 'true'
    runs-on: ubuntu-latest
    environment: staging
    concurrency: deploy-staging
    timeout-minutes: 20
    steps:
      - name: Déploiement
        run: |
          TAG='${{ needs.build.outputs.tag }}'
          install -m 600 /dev/null key
          printf '%s\n' "$SSH_PRIVATE_KEY" > key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > known_hosts
          # La clé est restreinte sur le serveur à ci-deploy.sh : elle ne peut que déployer
          ssh -i key -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes \
            "deploy@$SSH_HOST" "deploy $TAG"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

  # ─────────────── Production (étiquette de version, approbation manuelle) ───────────────
  production:
    name: Production
    # Activé quand le serveur de production est prêt (variable DEPLOY_PRODUCTION=true)
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      vars.DEPLOY_PRODUCTION == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-production
    timeout-minutes: 20
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ré-étiquetage de l'image testée en staging (sans reconstruction)
        run: |
          OWNER="${OWNER,,}"
          SOURCE="sha-${GITHUB_SHA::7}"
          for image in traiteur-api traiteur-web; do
            if ! docker buildx imagetools inspect "$REGISTRY/$OWNER/$image:$SOURCE" >/dev/null; then
              echo "::error::$image:$SOURCE introuvable : la version doit d'abord passer par main et le staging."
              exit 1
            fi
            docker buildx imagetools create -t "$REGISTRY/$OWNER/$image:$GITHUB_REF_NAME" \
              "$REGISTRY/$OWNER/$image:$SOURCE"
          done
        env:
          OWNER: ${{ github.repository_owner }}
        shell: bash

      - name: Déploiement
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$SSH_PRIVATE_KEY" > key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > known_hosts
          ssh -i key -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes \
            "deploy@$SSH_HOST" "deploy $GITHUB_REF_NAME"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

  # ─────────────── Redéploiement manuel (retour en arrière) ───────────────
  manual:
    name: Redéploiement manuel
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency: deploy-${{ inputs.environment }}
    timeout-minutes: 20
    steps:
      - name: Déploiement
        run: |
          [[ "$VERSION" =~ ^(sha-[0-9a-f]{7,40}|v[0-9]+\.[0-9]+\.[0-9]+)$ ]] || {
            echo "::error::Version invalide : $VERSION"; exit 1; }
          install -m 600 /dev/null key
          printf '%s\n' "$SSH_PRIVATE_KEY" > key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > known_hosts
          ssh -i key -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes \
            "deploy@$SSH_HOST" "deploy $VERSION"
        env:
          VERSION: ${{ inputs.version }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        shell: bash
